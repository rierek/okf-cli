name: test

on:
  push:
    branches: [main, "milestone/**", "wt/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # tomllib (okf-cli.py) braucht >= 3.11
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # APFS ist case-insensitiv: nur hier laufen die 4 Case-Tests.
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: extractions/setup-just@v2
      # Optionale Abhaengigkeiten: ohne sie werden 6 Tests uebersprungen.
      - run: python -m pip install argcomplete mcp
      # Leeres HOME: beweist, dass die Suite keinen Live-Vault
      # (~/Obsidian/Knowledge-Catalogue) braucht oder beschreibt (CLAUDE.md Regel 1).
      - name: just test (leeres HOME)
        run: HOME="$(mktemp -d)" just test
      - name: Arbeitsbaum sauber (Tests hinterlassen keine Reste)
        run: git diff --exit-code && test -z "$(git status --porcelain)"
