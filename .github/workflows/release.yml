name: release

# Runs when the PO pushes a rel-* tag (CLAUDE.md rule 19). Nothing here creates or pushes a tag.
# workflow_dispatch is a dry run: it builds, makes provenance, creates a DRAFT release named
# dry-run-<sha>, lists its assets and deletes it. It never publishes and never creates a tag.
on:
  push:
    tags: ["rel-*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build wheel and sdist
        run: uv run --no-project --with build python -m build --outdir dist
      # base64 of `sha256sum <file>` lines: the subjects of the provenance
      - name: Hash artifacts
        id: hash
        run: echo "hashes=$(cd dist && sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # The SLSA generator is referenced by tag, not SHA: slsa-verifier rejects a SHA ref.
  # upload-assets stays false: the action would publish the release, and an immutable release
  # (repository setting) accepts no further asset. The provenance stays a run artifact and the
  # release job below attaches it before the release is published.
  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false

  release:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: release-files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: release-files
      # Draft first, publish last: a published immutable release cannot take another file.
      - name: Create the draft release and attach every file
        env:
          PROVENANCE: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          set -euo pipefail
          ls -l release-files
          test -n "$(ls release-files/*.whl)" && test -n "$(ls release-files/*.tar.gz)" && test -f "release-files/$PROVENANCE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="$(echo "${TAG#rel-}" | tr - .)"
            gh release create "$TAG" --draft --verify-tag --title "okf-cli $VERSION" \
              --notes-file "RELEASE-$VERSION.md"
          else
            TAG="dry-run-${GITHUB_SHA::7}"
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "dry run" --notes "dry run"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release upload "$TAG" release-files/*
      - name: Publish, or delete the dry-run draft
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,assets -q '{draft:.isDraft,assets:[.assets[].name]}'
          # wheel, sdist, provenance: nothing else may ride along
          [ "$(gh release view "$TAG" --json assets -q '.assets|length')" = 3 ]
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release edit "$TAG" --draft=false
          else
            gh release delete "$TAG" --yes
          fi
