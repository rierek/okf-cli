# OKF Toolchain Revision — Synthesis & Quality Assessment
# Driving question: "how good are okf-cli + okf-mcp right now?"
# Generated: 2026-07-25. Grounds: 01-storage / 02-verbs / 03-mcp-config / 04-skills / 05-cli-docs .yaml
# Codes: B=Bug I=Improvement Q=Question. Status: open unless noted.

verified_live:
  - id: LIVE01
    claim: "okf_find MCP tool works — returns ranked results with score/title/type/path/description."
    path: "live call mcp__okf__okf_find(root=Knowledge-Catalogue, query='okf cli overview') -> 3 hits"
  - id: LIVE02
    claim: "okf_index MCP tool is BROKEN — fails with 'unrecognized arguments: --json' (exit 2)."
    path: "live call mcp__okf__okf_index(bundle=okf-meta-wiki) -> RuntimeError"
  - id: LIVE03
    claim: "okf_list MCP tool is BROKEN — same '--json' arg rejection as okf_index."
    path: "live call mcp__okf__okf_list(type=concept) -> RuntimeError"
  - id: LIVE04
    claim: "CLI exposes exactly 20 verbs — confirmed by the argparse usage line printed in the error output."
    path: "usage: {index,list,find,read,prime,info,toc,visualize,refs,rewrite-path,rename,reindex,log,tags,merge-tags,remove-tags,normalize-tags,check,fix-crosslinks,fix-xml-tags}"

bugs:
  - id: B01
    severity: high
    claim: "2 of 9 MCP tools (okf_index, okf_list = 22%) are non-functional: okf_mcp.py passes --json to okf-cli, but those subcommands do not define --json."
    path: /Users/erik/Obsidian/tools/okf-tools/mcp/okf_mcp.py (index/list handlers) vs cli/okf-cli.py:1884,1889
    status: confirmed-live
    fix_direction: "either add --json to index/list argparse in okf-cli.py, or stop sending --json from okf_mcp.py and parse text output"

improvements:
  - id: I01
    claim: "MCP surface covers only 9 of 20 CLI verbs (45%). 11 CLI-only, incl. prime, info, log, tags, merge-tags, remove-tags, normalize-tags, visualize, rewrite-path, fix-crosslinks, fix-xml-tags."
    path: 02-verbs.yaml#coverage_analysis
  - id: I02
    claim: "Default --root resolves to the okf-cli.py script directory, not the Knowledge Catalogue — every caller MUST pass --root or silently operate on the wrong root."
    path: /Users/erik/Obsidian/tools/okf-tools/cli/okf-cli.py:72-73,1983-1984
  - id: I03
    claim: "okf-meta-wiki reference doc claims '100% coverage, 18/18 verbs' but omits 2 real verbs (prime, remove-tags); actual count is 20 -> doc is stale/incomplete while asserting completeness."
    path: /Users/erik/Obsidian/Knowledge-Catalogue/okf-meta-wiki/okf-cli-mcp-overview.md (Table 1) vs LIVE04
  - id: I04
    claim: "Doc grounds claims on absolute okf-cli.py line numbers (e.g. :1737, :392); source edits drift these — 13 days old already. High maintenance cost, no auto-extraction."
    path: 05-cli-docs.yaml#staleness_signals

open_questions:
  - id: Q01
    claim: "Scope of this revision: fix the confirmed bug (B01) only, or broader hardening (MCP coverage I01 + root-safety I02 + doc auto-sync I04)?"
  - id: Q02
    claim: "Should MCP reach parity with CLI, or is the 9-verb read/maintenance subset intentional (write/admin verbs deliberately CLI-only for safety)?"
  - id: Q03
    claim: "Is there a test suite for okf-cli / okf_mcp? B01 is a regression a single smoke test would have caught — no test dir surfaced in storage scan."
    path: "01-storage.yaml reports no package manifest / no visible tests dir"
  - id: Q04
    claim: "Doc-drift: adopt generated reference (okf-cli --help -> markdown) instead of hand-maintained line-number-anchored doc?"
